name: 'Sanity: types-aiobotocore'
on:
  push: null
jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      aiobotocore: ${{ steps.aiobotocore.outputs.result }}
    steps:
    - uses: actions/checkout@v4
    - name: Extract aiobotocore version
      id: aiobotocore
      uses: actions/github-script@v7
      with:
        result-encoding: string
        script: 'const { getAioBotocoreVersion, setupGlobals } = require(''./.github/workflows/helpers.js'')

          setupGlobals({ core, context, fetch })

          const inputAiobotocoreVersion = context.payload.inputs && context.payload.inputs.aiobotocore_version

          const version = inputAiobotocoreVersion ? inputAiobotocoreVersion : await getAioBotocoreVersion()

          core.notice(`aiobotocore version ${version}`)

          return version

          '
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        version: latest
    - name: Install the project
      run: uv sync --extra check --dev
    - name: Install aiobotocore
      env:
        AIOBOTOCORE_VERSION: ${{ steps.aiobotocore.outputs.result }}
      run: 'uv pip install aiobotocore==${AIOBOTOCORE_VERSION}

        '
    - name: Build main packages
      run: "rm -rf mypy_boto3_output/*\nuv run mypy_boto3_builder mypy_boto3_output \\\n  --product aiobotocore\
        \ \\\n  --no-smart-version \\\n  --download-static-stubs\n"
    - name: Check s3 output
      run: "uv run mypy_boto3_builder mypy_boto3_output \\\n  --product aiobotocore-services \\\n  -s\
        \ s3 \\\n  --no-smart-version\nuv run ./scripts/check_output.py -p ./mypy_boto3_output s3\n"
    - name: Build packages
      run: "uv run mypy_boto3_builder mypy_boto3_output \\\n  --product aiobotocore-services \\\n  --no-smart-version\n"
    - name: Check output
      run: 'uv run ./scripts/check_output.py -p ./mypy_boto3_output

        '
